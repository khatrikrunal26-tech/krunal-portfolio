<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#04070B"/>
  <defs>
    <linearGradient id="topG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="leftG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="rightG" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="hotCore">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#04070B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background Glow -->
  <circle cx="16" cy="16" r="8" fill="url(#hotCore)" opacity="0.6"/>
  <!-- 3D Isometric Cube Faces -->
  <polygon points="16,7 24,11.5 16,16 8,11.5" fill="url(#topG)" stroke="rgba(255,255,255,0.4)" stroke-width="0.7"/>
  <polygon points="8,11.5 16,16 16,25 8,20.5" fill="url(#leftG)" stroke="rgba(56,189,248,0.4)" stroke-width="0.7"/>
  <polygon points="16,16 24,11.5 24,20.5 16,25" fill="url(#rightG)" stroke="rgba(99,102,241,0.4)" stroke-width="0.7"/>
  <!-- Inner Tesseract Core -->
  <polygon points="16,11.5 20,13.75 16,16 12,13.75" fill="#FFFFFF" opacity="0.9"/>
  <polygon points="12,13.75 16,16 16,20.5 12,18.25" fill="#38BDF8" opacity="0.85"/>
  <polygon points="16,16 20,13.75 20,18.25 16,20.5" fill="#C084FC" opacity="0.85"/>
  <!-- Corner Nodes -->
  <circle cx="16" cy="16" r="1" fill="#FFFFFF"/>
</svg>

